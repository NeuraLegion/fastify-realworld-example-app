name: Security Tests

on:
  pull_request:
    branches:
      - '**'

permissions:
  checks: write
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-latest
    env:
      APILAYER_KEY: your_apilayer_key
      API_HOST: localhost
      API_PORT: 5000
      API_PREFIX: /api
      JWT_EXPIRES_IN: 1h
      JWT_ISSUER: your_jwt_issuer
      JWT_SECRET: your_jwt_secret
      NODE_ENV: development
      BRIGHT_TARGET_URL: http://127.0.0.1:5000
      BRIGHT_HOSTNAME: ${{ vars.BRIGHT_HOSTNAME }}
      BRIGHT_PROJECT_ID: ${{ vars.BRIGHT_PROJECT_ID }}
      BRIGHT_TOKEN: ${{ secrets.BRIGHT_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '22'

    - name: Install dependencies
      run: npm ci

    - name: Install SecTester dependencies
      run: npm i --save=false @sectester/core @sectester/repeater @sectester/scan @sectester/runner

    - name: Create .env file
      run: npm run create:env

    - name: Start application
      run: npm run dev &

    - name: Wait for application to be ready
      uses: jakejarvis/wait-for-it@v1
      with:
        url: 'http://127.0.0.1:5000'
        timeout: 60

    - name: Run security tests
      run: |
        node --experimental-transform-types \
             --experimental-strip-types \
             --experimental-detect-module \
             --disable-warning=MODULE_TYPELESS_PACKAGE_JSON \
             --disable-warning=ExperimentalWarning \
             --test-force-exit \
             --test .brightsec/tests/*.test.ts \
             --test-concurrency=4